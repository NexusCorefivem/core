## =========================================================
## Nexus Core - FXServer Configuration
## txAdmin-ready server.cfg
## =========================================================

## Identity
sv_hostname "{{serverName}}"
sets sv_projectName "Nexus Core"
sets sv_projectDesc "Custom FiveM roleplay framework built from scratch."
sets locale "en-US"
sets tags "roleplay,rp,nexus,nexus-core,serious-rp,custom-framework"
load_server_icon server-icon.png

## Core server settings
sv_enforceGameBuild 3258
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set onesync on
set mysql_connection_string "{{dbConnectionString}}"

## Network
{{serverEndpoints}}
sv_endpointprivacy true

## Optional API keys
set steam_webApiKey "changeme"

## Voice / communication
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableSubmix 1
setr voice_syncData 1

## Game behavior
sets banner_detail ""
sets banner_connecting ""
sv_scriptHookAllowed 0
set sv_requestParanoia 3
set sv_filterRequestControl 4

## Logging
con_miniconChannels script:info script:warning script:error

## Resource permissions
add_ace resource.nexus-core command allow
add_ace resource.nexus-admin command allow

## =========================================================
## ACE groups
## =========================================================

add_principal group.owner group.admin
add_principal group.admin group.dev
add_principal group.dev group.moderator
add_principal group.moderator group.support
add_principal group.support group.staff
add_principal group.staff group.user

## Nexus Core ACE permissions
add_ace group.support nexus.staff allow
add_ace group.moderator nexus.staff allow
add_ace group.dev nexus.staff allow
add_ace group.dev nexus.admin allow
add_ace group.staff nexus.staff allow
add_ace group.admin nexus.staff allow
add_ace group.admin nexus.admin allow
add_ace group.owner nexus.staff allow
add_ace group.owner nexus.admin allow
add_ace group.owner nexus.owner allow

## Example command permissions
add_ace group.support command.tpm allow
add_ace group.support command.kick deny
add_ace group.moderator command.kick allow
add_ace group.moderator command.bring allow
add_ace group.moderator command.freeze allow
add_ace group.dev command allow
add_ace group.staff command.kick allow
add_ace group.staff command.tpm allow
add_ace group.admin command allow
add_ace group.owner command allow

## Console permissions
add_ace builtin.everyone command.quit deny
add_ace builtin.everyone command.stop deny
add_ace builtin.everyone command.restart deny

## Add your staff identifiers below
## Replace the examples with real license identifiers
## Example format:
## add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.owner
## add_principal identifier.license:yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy group.admin
## add_principal identifier.license:dddddddddddddddddddddddddddddddddddddddd group.dev
