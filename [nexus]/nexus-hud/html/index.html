<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus HUD</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="hud">
        <div class="bar"><span>Health</span><strong id="health">100</strong></div>
        <div class="bar"><span>Armor</span><strong id="armor">0</strong></div>
        <div class="bar"><span>Cash</span><strong id="cash">0</strong></div>
        <div class="bar"><span>Bank</span><strong id="bank">0</strong></div>
        <div class="bar"><span>Job</span><strong id="job">-</strong></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
