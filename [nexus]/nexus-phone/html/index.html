<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Phone</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <h2>Nexus Phone</h2>
            <input id="target" type="number" placeholder="Player ID">
            <textarea id="message" placeholder="Message"></textarea>
            <button id="send">Send</button>
            <button id="close">Close</button>
            <div id="inbox"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
