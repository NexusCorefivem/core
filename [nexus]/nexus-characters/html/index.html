<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Characters</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <div class="header">
                <h1>Nexus Core Characters</h1>
                <button id="closeButton" class="ghost">Close</button>
            </div>
            <div class="content">
                <div class="characters">
                    <h2>Characters</h2>
                    <div id="characterList" class="character-list"></div>
                </div>
                <div class="creator">
                    <h2>Create Character</h2>
                    <form id="createForm">
                        <input type="text" id="firstname" placeholder="Firstname" maxlength="24" required>
                        <input type="text" id="lastname" placeholder="Lastname" maxlength="24" required>
                        <input type="date" id="dateofbirth" required>
                        <select id="gender">
                            <option value="m">Male</option>
                            <option value="f">Female</option>
                        </select>
                        <select id="locale"></select>
                        <button type="submit">Create</button>
                    </form>
                    <p id="statusText" class="status"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
